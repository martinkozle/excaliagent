name: Publish

# Push a tag like v0.2.0 (matching package.json "version") to publish to npm.
# Uses npm trusted publishing (OIDC): no token in the repo. One-time setup on
# npmjs.com: package settings → Trusted publishers → GitHub Actions,
# repository martinkozle/excaliagent, workflow publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm publish --provenance --access public
